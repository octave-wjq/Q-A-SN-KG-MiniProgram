<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HIV/AIDS 症状网络图</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #eef3fb;
      --card: rgba(255, 255, 255, 0.94);
      --line: #d7deea;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0f62fe;
      --topbar-h: 90px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 80% 20%, #ffffff 0%, var(--bg) 52%, #e4ebf7 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .title {
      width: 100%;
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .search-row {
      width: 100%;
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      padding: 9px 10px;
      outline: none;
      background: #ffffff;
    }

    .search-row input:focus {
      border-color: #99b6ff;
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.13);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 13px;
      padding: 8px 10px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: #adc1ef;
      background: #f7faff;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    button.primary:hover {
      background: #044ed6;
      border-color: #044ed6;
    }

    .network-wrap {
      position: absolute;
      inset: var(--topbar-h) 0 0 0;
    }

    #network {
      width: 100%;
      height: 100%;
    }

    .card {
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    .legend {
      z-index: 18;
      left: 10px;
      top: calc(var(--topbar-h) + 10px);
      width: min(240px, 72vw);
    }

    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
    }

    .legend-body {
      padding: 8px 10px;
      max-height: 36vh;
      overflow: auto;
    }

    .legend.collapsed .legend-body {
      display: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .status-chip {
      position: absolute;
      z-index: 16;
      right: 10px;
      bottom: 12px;
      padding: 7px 10px;
      font-size: 12px;
      color: #334155;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
    }

    .detail-panel {
      position: absolute;
      z-index: 19;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.14);
      display: none;
      overflow: hidden;
    }

    .detail-panel.visible {
      display: block;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 600;
    }

    .detail-body {
      padding: 9px 10px;
      font-size: 13px;
      color: #334155;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .detail-row {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-row.full {
      grid-column: 1 / -1;
      white-space: normal;
      word-break: break-word;
    }

    .message {
      position: absolute;
      z-index: 22;
      left: 50%;
      top: calc(var(--topbar-h) + 16px);
      transform: translateX(-50%);
      max-width: calc(100vw - 30px);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      display: none;
      text-align: center;
    }

    .loading {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(2px);
      font-size: 14px;
      color: #1e293b;
    }

    @media (min-width: 900px) {
      .title {
        width: auto;
        margin-right: auto;
      }

      .search-row {
        width: min(420px, 42vw);
      }

      .detail-panel {
        left: 14px;
        right: auto;
        width: min(430px, 56vw);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="topBar" class="top-bar">
      <h1 class="title">HIV/AIDS 症状网络图</h1>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="输入症状名称（如：疲乏）" />
        <button id="searchBtn" class="primary">搜索</button>
        <button id="resetBtn">重置视图</button>
      </div>
    </div>

    <div class="network-wrap">
      <div id="network"></div>
    </div>

    <div id="legend" class="card legend">
      <div class="legend-header">
        <span>分组图例</span>
        <button id="legendToggleBtn" type="button">折叠</button>
      </div>
      <div id="legendBody" class="legend-body"></div>
    </div>

    <div id="statusChip" class="status-chip">加载中...</div>

    <div id="detailPanel" class="detail-panel">
      <div class="detail-header">
        <span>节点详情</span>
        <button id="closeDetailBtn" type="button">关闭</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </div>

    <div id="message" class="message"></div>
    <div id="loading" class="loading">正在加载症状网络数据...</div>
  </div>

  <script>
    (function () {
      var topBar = document.getElementById("topBar");
      var searchInput = document.getElementById("searchInput");
      var searchBtn = document.getElementById("searchBtn");
      var resetBtn = document.getElementById("resetBtn");
      var legend = document.getElementById("legend");
      var legendBody = document.getElementById("legendBody");
      var legendToggleBtn = document.getElementById("legendToggleBtn");
      var statusChip = document.getElementById("statusChip");
      var detailPanel = document.getElementById("detailPanel");
      var detailBody = document.getElementById("detailBody");
      var closeDetailBtn = document.getElementById("closeDetailBtn");
      var message = document.getElementById("message");
      var loading = document.getElementById("loading");
      var networkContainer = document.getElementById("network");

      var rawData = null;
      var nodeMap = new Map();
      var network = null;
      var nodeDataSet = null;
      var edgeDataSet = null;
      var minCentrality = 0;
      var maxCentrality = 1;
      var minWeightAbs = 0;
      var maxWeightAbs = 1;
      var messageTimer = null;

      function showMessage(text) {
        if (messageTimer) {
          clearTimeout(messageTimer);
        }
        message.textContent = text;
        message.style.display = "block";
        messageTimer = setTimeout(function () {
          message.style.display = "none";
        }, 2200);
      }

      function updateTopOffset() {
        var h = topBar ? topBar.offsetHeight : 90;
        document.documentElement.style.setProperty("--topbar-h", h + "px");
      }

      function scale(value, min, max, outMin, outMax) {
        if (max === min) {
          return (outMin + outMax) / 2;
        }
        var ratio = (value - min) / (max - min);
        return outMin + ratio * (outMax - outMin);
      }

      function getGroupColor(group) {
        if (rawData.groups && rawData.groups[group] && rawData.groups[group].color) {
          return rawData.groups[group].color;
        }
        return "#64748b";
      }

      function toNodeItem(node) {
        return {
          id: node.id,
          label: node.label,
          group: node.primary_type,
          value: Number(node.centrality_strength || 0),
          shape: "dot",
          color: {
            background: getGroupColor(node.primary_type),
            border: "rgba(255,255,255,0.65)",
            highlight: {
              background: getGroupColor(node.primary_type),
              border: "#ffffff"
            }
          },
          borderWidth: 1.2,
          font: {
            size: 14,
            color: "#0f172a",
            strokeWidth: 2,
            strokeColor: "rgba(255,255,255,0.85)",
            face: "PingFang SC, Microsoft YaHei, Helvetica Neue, Helvetica, Arial, sans-serif"
          },
          title:
            node.label +
            "\n分组: " +
            (node.primary_type || "未知") +
            "\n中心性: " +
            Number(node.centrality_strength || 0).toFixed(6) +
            "\n频率: " +
            Number(node.frequency || 0)
        };
      }

      function toEdgeItem(edge) {
        var absWeight = Math.abs(Number(edge.weight || 0));
        var isNegative = !!edge.is_negative || Number(edge.weight || 0) < 0;

        return {
          id: edge.id,
          from: edge.source,
          to: edge.target,
          label: Number(edge.weight || 0).toFixed(2),
          width: scale(absWeight, minWeightAbs, maxWeightAbs, 1.2, 6),
          dashes: isNegative,
          color: {
            color: isNegative ? "rgba(220, 38, 38, 0.55)" : "rgba(71, 123, 217, 0.5)",
            highlight: isNegative ? "#b91c1c" : "#1d4ed8",
            hover: isNegative ? "#b91c1c" : "#1d4ed8",
            inherit: false
          },
          smooth: {
            enabled: true,
            type: "continuous",
            roundness: 0.18
          },
          font: {
            size: 11,
            color: "#475569",
            background: "rgba(255,255,255,0.78)",
            strokeWidth: 0
          }
        };
      }

      function applyDefaultEdgeStyles() {
        if (!edgeDataSet) {
          return;
        }
        var updates = edgeDataSet.get().map(function (edge) {
          var isNegative = !!edge.dashes;
          return {
            id: edge.id,
            width: edge.width,
            color: {
              color: isNegative ? "rgba(220, 38, 38, 0.55)" : "rgba(71, 123, 217, 0.5)",
              highlight: isNegative ? "#b91c1c" : "#1d4ed8",
              hover: isNegative ? "#b91c1c" : "#1d4ed8",
              inherit: false
            },
            font: {
              size: 11,
              color: "#475569",
              background: "rgba(255,255,255,0.78)",
              strokeWidth: 0
            }
          };
        });
        edgeDataSet.update(updates);
      }

      function highlightEdgesForNode(nodeId) {
        if (!network || !edgeDataSet) {
          return;
        }

        var connected = new Set(network.getConnectedEdges(nodeId));
        var updates = edgeDataSet.get().map(function (edge) {
          var isNegative = !!edge.dashes;
          if (connected.has(edge.id)) {
            return {
              id: edge.id,
              width: edge.width + 1.4,
              color: {
                color: isNegative ? "#b91c1c" : "#1d4ed8",
                highlight: isNegative ? "#b91c1c" : "#1d4ed8",
                hover: isNegative ? "#b91c1c" : "#1d4ed8",
                inherit: false
              },
              font: {
                size: 11,
                color: "#0f172a",
                background: "rgba(255,255,255,0.95)",
                strokeWidth: 0
              }
            };
          }
          return {
            id: edge.id,
            width: Math.max(0.8, edge.width * 0.72),
            color: {
              color: "rgba(148, 163, 184, 0.22)",
              highlight: "rgba(148, 163, 184, 0.22)",
              hover: "rgba(148, 163, 184, 0.22)",
              inherit: false
            },
            font: {
              size: 11,
              color: "rgba(100, 116, 139, 0.33)",
              background: "rgba(255,255,255,0.48)",
              strokeWidth: 0
            }
          };
        });

        edgeDataSet.update(updates);
      }

      function highlightNodesForNode(nodeId) {
        if (!network || !nodeDataSet) {
          return;
        }

        var keep = new Set([nodeId].concat(network.getConnectedNodes(nodeId)));
        var updates = nodeDataSet.getIds().map(function (id) {
          if (keep.has(id)) {
            return {
              id: id,
              opacity: 1,
              borderWidth: id === nodeId ? 2.6 : 1.2,
              font: {
                size: 14,
                color: "#0f172a",
                strokeWidth: 2,
                strokeColor: "rgba(255,255,255,0.85)",
                face: "PingFang SC, Microsoft YaHei, Helvetica Neue, Helvetica, Arial, sans-serif"
              }
            };
          }
          return {
            id: id,
            opacity: 0.15,
            borderWidth: 1.2,
            font: {
              size: 14,
              color: "rgba(120, 120, 120, 0.25)",
              strokeWidth: 2,
              strokeColor: "rgba(255,255,255,0.85)",
              face: "PingFang SC, Microsoft YaHei, Helvetica Neue, Helvetica, Arial, sans-serif"
            }
          };
        });

        nodeDataSet.update(updates);
      }

      function resetNodeStyles() {
        if (!nodeDataSet) {
          return;
        }
        var updates = nodeDataSet.getIds().map(function (id) {
          return {
            id: id,
            opacity: 1,
            borderWidth: 1.2,
            font: {
              size: 14,
              color: "#0f172a",
              strokeWidth: 2,
              strokeColor: "rgba(255,255,255,0.85)",
              face: "PingFang SC, Microsoft YaHei, Helvetica Neue, Helvetica, Arial, sans-serif"
            }
          };
        });
        nodeDataSet.update(updates);
      }

      function showNodeDetail(nodeId) {
        var node = nodeMap.get(nodeId);
        if (!node) {
          return;
        }

        var connectedEdges = network ? network.getConnectedEdges(nodeId).length : 0;
        detailBody.innerHTML =
          '<div class="detail-row full"><strong>名称：</strong>' +
          node.label +
          "</div>" +
          '<div class="detail-row"><strong>分组：</strong>' +
          (node.primary_type || "未知") +
          "</div>" +
          '<div class="detail-row"><strong>中心性：</strong>' +
          Number(node.centrality_strength || 0).toFixed(6) +
          "</div>" +
          '<div class="detail-row"><strong>频率：</strong>' +
          Number(node.frequency || 0) +
          "</div>" +
          '<div class="detail-row"><strong>当前可见关联边：</strong>' +
          connectedEdges +
          "</div>";

        detailPanel.classList.add("visible");
      }

      function hideNodeDetail() {
        detailPanel.classList.remove("visible");
      }

      function renderLegend() {
        var groups = rawData.groups || {};
        var entries = Object.keys(groups)
          .map(function (groupName) {
            return {
              name: groupName,
              count: Number(groups[groupName].count || 0),
              color: groups[groupName].color || "#64748b"
            };
          })
          .sort(function (a, b) {
            return b.count - a.count;
          });

        legendBody.innerHTML = entries
          .map(function (entry) {
            return (
              '<div class="legend-item">' +
              '<div class="legend-left">' +
              '<span class="swatch" style="background:' + entry.color + '"></span>' +
              "<span>" +
              entry.name +
              "</span>" +
              "</div>" +
              '<span class="filter-count">' +
              entry.count +
              "</span>" +
              "</div>"
            );
          })
          .join("");
      }

      function renderNetwork() {
        var nodeItems = rawData.nodes.map(toNodeItem);
        var edgeItems = rawData.edges.map(toEdgeItem);

        if (!network) {
          nodeDataSet = new vis.DataSet(nodeItems);
          edgeDataSet = new vis.DataSet(edgeItems);

          network = new vis.Network(
            networkContainer,
            { nodes: nodeDataSet, edges: edgeDataSet },
            {
              autoResize: true,
              interaction: {
                hover: true,
                dragView: true,
                zoomView: true,
                tooltipDelay: 120
              },
              nodes: {
                shape: "dot",
                scaling: {
                  min: 14,
                  max: 44,
                  label: {
                    enabled: true,
                    min: 12,
                    max: 18,
                    maxVisible: 46,
                    drawThreshold: 5
                  }
                }
              },
              edges: {
                smooth: {
                  enabled: true,
                  type: "continuous",
                  roundness: 0.18
                }
              },
              physics: {
                enabled: true,
                solver: "barnesHut",
                barnesHut: {
                  gravitationalConstant: -2000,
                  springConstant: 0.04,
                  springLength: 150,
                  damping: 0.1,
                  avoidOverlap: 0.26
                },
                stabilization: {
                  enabled: true,
                  iterations: 180,
                  updateInterval: 25
                }
              },
              layout: {
                improvedLayout: true
              }
            }
          );

          network.on("click", function (params) {
            if (params.nodes && params.nodes.length) {
              var nodeId = params.nodes[0];
              showNodeDetail(nodeId);
              highlightEdgesForNode(nodeId);
              highlightNodesForNode(nodeId);
            } else {
              hideNodeDetail();
              applyDefaultEdgeStyles();
            }
          });
        } else {
          nodeDataSet.clear();
          edgeDataSet.clear();
          nodeDataSet.add(nodeItems);
          edgeDataSet.add(edgeItems);
        }

        applyDefaultEdgeStyles();
        statusChip.textContent =
          "节点 " +
          rawData.stats.node_count +
          " · 边 " +
          rawData.stats.edge_count +
          " · 负权重边 " +
          rawData.edges.filter(function (edge) {
            return !!edge.is_negative || Number(edge.weight || 0) < 0;
          }).length;
      }

      function searchAndFocus() {
        if (!rawData || !nodeDataSet || !network) {
          showMessage("网络尚未加载完成");
          return;
        }

        var keyword = (searchInput.value || "").trim().toLowerCase();
        if (!keyword) {
          showMessage("请输入要搜索的症状名称");
          return;
        }

        var target = rawData.nodes.find(function (node) {
          return String(node.label || "").toLowerCase() === keyword;
        });

        if (!target) {
          target = rawData.nodes.find(function (node) {
            return String(node.label || "").toLowerCase().indexOf(keyword) !== -1;
          });
        }

        if (!target) {
          showMessage("未找到匹配症状");
          return;
        }

        network.selectNodes([target.id]);
        network.focus(target.id, {
          scale: 1.35,
          animation: {
            duration: 650,
            easingFunction: "easeInOutQuad"
          }
        });
        showNodeDetail(target.id);
        highlightEdgesForNode(target.id);
        highlightNodesForNode(target.id);
      }

      function bindEvents() {
        window.addEventListener("resize", updateTopOffset);

        searchBtn.addEventListener("click", searchAndFocus);
        searchInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            searchAndFocus();
          }
        });

        resetBtn.addEventListener("click", function () {
          if (network) {
            network.fit({
              animation: {
                duration: 600,
                easingFunction: "easeInOutQuad"
              }
            });
            network.unselectAll();
          }
          hideNodeDetail();
          applyDefaultEdgeStyles();
        });

        legendToggleBtn.addEventListener("click", function () {
          legend.classList.toggle("collapsed");
          legendToggleBtn.textContent = legend.classList.contains("collapsed") ? "展开" : "折叠";
        });

        closeDetailBtn.addEventListener("click", function () {
          hideNodeDetail();
          if (network) {
            network.unselectAll();
          }
          applyDefaultEdgeStyles();
        });
      }

      function initialize(data) {
        rawData = data;
        nodeMap = new Map(
          rawData.nodes.map(function (node) {
            return [node.id, node];
          })
        );

        var centralities = rawData.nodes.map(function (node) {
          return Number(node.centrality_strength || 0);
        });
        minCentrality = Math.min.apply(Math, centralities);
        maxCentrality = Math.max.apply(Math, centralities);

        var absWeights = rawData.edges.map(function (edge) {
          return Math.abs(Number(edge.weight || 0));
        });
        minWeightAbs = Math.min.apply(Math, absWeights);
        maxWeightAbs = Math.max.apply(Math, absWeights);

        renderLegend();
        renderNetwork();
        updateTopOffset();
        bindEvents();
      }

      fetch("/data/sn_graph_vis.json")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function (data) {
          initialize(data);
        })
        .catch(function (error) {
          showMessage("数据加载失败：" + error.message);
          statusChip.textContent = "数据加载失败";
        })
        .finally(function () {
          loading.style.display = "none";
        });
    })();
  </script>
</body>
</html>
