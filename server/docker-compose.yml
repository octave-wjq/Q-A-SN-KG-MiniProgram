services:
  neo4j:
    image: neo4j:5.20-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
    volumes:
      - neo4j_data:/data

  kg-api:
    build: .
    container_name: kg-api
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  neo4j_data:
